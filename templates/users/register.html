{% extends 'base.html' %}

{% block title %}Registro - GG Rewards{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center relative overflow-hidden py-20 px-4" style="margin-top: -6rem;">
    
    <!-- FONDOS DE LUZ -->
    <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-cyan-600/20 rounded-full mix-blend-screen filter blur-[128px] animate-float"></div>
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-600/20 rounded-full mix-blend-screen filter blur-[128px] animate-float" style="animation-delay: 3s;"></div>

    <!-- TARJETA DE REGISTRO -->
    <div class="relative w-full max-w-lg z-10">
        <!-- Borde neón cyan/purple -->
        <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-2xl blur opacity-75 animate-pulse"></div>
        
        <div class="relative bg-gray-900/80 dark:bg-gray-900/90 backdrop-blur-xl rounded-2xl shadow-2xl border border-gray-700 p-8 sm:p-10">
            
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-white mb-2">Únete al Squad</h2>
                <p class="text-gray-400 text-sm">Crea tu cuenta y empieza a sumar trofeos.</p>
            </div>

            <form method="POST" action="">
                {% csrf_token %}
                
                <!-- Nombre de Usuario -->
                <div class="mb-5">
                    <label for="username" class="block text-sm font-medium text-gray-300 mb-2">Nombre de Usuario</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-gamepad text-cyan-500"></i>
                        </div>
                        <input type="text" name="username" id="username" required 
                               class="block w-full pl-10 pr-3 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all"
                               placeholder="TuGamertag">
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-5">
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Correo Electrónico</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-envelope text-cyan-500"></i>
                        </div>
                        <input type="email" name="email" id="email" required 
                               class="block w-full pl-10 pr-3 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all"
                               placeholder="ejemplo@correo.com">
                    </div>
                </div>

                <!-- Grid para contraseñas -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Contraseña</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-cyan-500"></i>
                            </div>
                            <input type="password" name="password" id="password" required 
                                   class="block w-full pl-10 pr-3 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all"
                                   placeholder="••••••••">
                        </div>
                    </div>
                    <div>
                        <label for="confirm_password" class="block text-sm font-medium text-gray-300 mb-2">Confirmar</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-check-double text-cyan-500"></i>
                            </div>
                            <input type="password" name="confirm_password" id="confirm_password" required 
                                   class="block w-full pl-10 pr-3 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all"
                                   placeholder="••••••••">
                        </div>
                    </div>
                </div>

                <!-- Términos -->
                <div class="flex items-start mb-8">
                    <div class="flex items-center h-5">
                        <input id="terms" name="terms" type="checkbox" required 
                               class="h-4 w-4 text-cyan-600 focus:ring-cyan-500 border-gray-700 rounded bg-gray-800">
                    </div>
                    <div class="ml-3 text-sm">
                        <label for="terms" class="font-medium text-gray-400">Acepto los <a href="#" class="text-cyan-400 hover:text-cyan-300">Términos y Condiciones</a> y la Política de Privacidad.</label>
                    </div>
                </div>

                <!-- Botón Registro -->
                <button type="submit" 
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-500 transform hover:scale-[1.02] transition-all shadow-[0_0_20px_rgba(8,145,178,0.4)]">
                    CREAR CUENTA
                </button>
            </form>

            <p class="mt-8 text-center text-sm text-gray-400">
                ¿Ya tienes cuenta? 
                <a href="/login/" class="font-bold text-cyan-400 hover:text-cyan-300 transition-colors">
                    Inicia sesión aquí
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
